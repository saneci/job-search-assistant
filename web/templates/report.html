<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>Отчёт по вакансиям</title>
        <style>
            :root {
                --bg: #f0f2f5;
                --text: #1a1a2e;
                --surface: #fff;
                --surface-2: #f8f9fb;
                --border: #e8eaed;
                --border-soft: #f0f0f0;
                --muted: #666;
                --muted-strong: #555;
                --muted-soft: #777;
                --muted-light: #999;
                --muted-empty: #aaa;
                --link: #1565c0;
                --filter-border: #d0d5dd;
                --filter-bg: #fff;
                --filter-text: #444;
                --filter-hover: #2d5a87;
                --filter-active-bg: #1e3a5f;
                --filter-active-text: #fff;
                --row-hover: #f5f8ff;
                --header-grad: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
                --header-text: #fff;
                --shadow-card: 0 2px 8px rgba(0, 0, 0, .06);
                --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .1);
                --shadow-header: 0 4px 16px rgba(0, 0, 0, .12);
                --spinner-border: #e0e0e0;
                --spinner-top: #2d5a87;
                --btn-toggle-bg: rgba(255, 255, 255, .15);
                --btn-toggle-hover: rgba(255, 255, 255, .3);
            }

            [data-theme="dark"] {
                --bg: #0f1620;
                --text: #e6edf3;
                --surface: #16202b;
                --surface-2: #1c2733;
                --border: #2a3744;
                --border-soft: #223040;
                --muted: #9aa7b4;
                --muted-strong: #b6c2ce;
                --muted-soft: #8b98a5;
                --muted-light: #7a8794;
                --muted-empty: #5f6b78;
                --link: #6ab0f3;
                --filter-border: #33465a;
                --filter-bg: #1c2733;
                --filter-text: #cdd6df;
                --filter-hover: #6ab0f3;
                --filter-active-bg: #2d5a87;
                --filter-active-text: #fff;
                --row-hover: #1e2b3a;
                --header-grad: linear-gradient(135deg, #0b1a2a 0%, #17324d 100%);
                --header-text: #e6edf3;
                --shadow-card: 0 2px 8px rgba(0, 0, 0, .4);
                --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .55);
                --shadow-header: 0 4px 16px rgba(0, 0, 0, .5);
                --spinner-border: #2a3744;
                --spinner-top: #6ab0f3;
                --btn-toggle-bg: rgba(255, 255, 255, .1);
                --btn-toggle-hover: rgba(255, 255, 255, .22);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                padding: 24px;
                line-height: 1.5;
                transition: background .2s ease, color .2s ease;
            }

            .container {
                max-width: 1440px;
                margin: 0 auto;
            }

            .header {
                background: var(--header-grad);
                color: var(--header-text);
                padding: 28px 32px;
                border-radius: 16px;
                margin-bottom: 24px;
                box-shadow: var(--shadow-header);
                transition: background .2s ease;
            }

            .header-top {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 16px;
            }

            .header h1 {
                font-size: 1.6rem;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .header .meta {
                font-size: .9rem;
                opacity: .85;
            }

            .theme-toggle {
                flex-shrink: 0;
                width: 40px;
                height: 40px;
                border: none;
                border-radius: 50%;
                background: var(--btn-toggle-bg);
                color: var(--header-text);
                font-size: 1.2rem;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: background .15s ease, transform .15s ease;
            }

            .theme-toggle:hover {
                background: var(--btn-toggle-hover);
                transform: scale(1.05);
            }

            .theme-toggle:active {
                transform: scale(.95);
            }

            .summary-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
                margin-bottom: 24px;
            }

            .summary-card {
                background: var(--surface);
                border-radius: 12px;
                padding: 16px 20px;
                box-shadow: var(--shadow-card);
                border-left: 4px solid #ccc;
                transition: transform .15s, box-shadow .15s, background .2s ease;
            }

            .summary-card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-card-hover);
            }

            .summary-card .label {
                font-size: .8rem;
                text-transform: uppercase;
                letter-spacing: .5px;
                color: var(--muted);
                font-weight: 600;
            }

            .summary-card .value {
                font-size: 1.8rem;
                font-weight: 700;
                margin-top: 4px;
            }

            .card-sent {
                border-left-color: #2e7d32;
            }

            .card-sent .value {
                color: #2e7d32;
            }

            .card-skipped {
                border-left-color: #e65100;
            }

            .card-skipped .value {
                color: #e65100;
            }

            .card-queued {
                border-left-color: #1565c0;
            }

            .card-queued .value {
                color: #1565c0;
            }

            .card-excluded {
                border-left-color: #6a1b9a;
            }

            .card-excluded .value {
                color: #6a1b9a;
            }

            .card-error {
                border-left-color: #c62828;
            }

            .card-error .value {
                color: #c62828;
            }

            .card-rejected {
                border-left-color: #ad1457;
            }

            .card-rejected .value {
                color: #ad1457;
            }

            .filters {
                background: var(--surface);
                border-radius: 12px;
                padding: 16px 20px;
                margin-bottom: 20px;
                box-shadow: var(--shadow-card);
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
                transition: background .2s ease;
            }

            .filters label {
                font-size: .85rem;
                font-weight: 600;
                color: var(--muted-strong);
            }

            .filter-group {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }

            .filter-btn {
                padding: 6px 16px;
                border: 1.5px solid var(--filter-border);
                border-radius: 20px;
                background: var(--filter-bg);
                cursor: pointer;
                font-size: .85rem;
                font-weight: 500;
                color: var(--filter-text);
                transition: all .15s;
                white-space: nowrap;
            }

            .filter-btn:hover {
                border-color: var(--filter-hover);
                color: var(--filter-hover);
            }

            .filter-btn.active {
                background: var(--filter-active-bg);
                color: var(--filter-active-text);
                border-color: var(--filter-active-bg);
            }

            .search-input {
                flex: 1;
                min-width: 200px;
                padding: 8px 16px;
                border: 1.5px solid var(--filter-border);
                border-radius: 20px;
                font-size: .85rem;
                outline: none;
                transition: border-color .15s, background .2s ease, color .2s ease;
                background: var(--filter-bg);
                color: var(--text);
            }

            .search-input:focus {
                border-color: var(--filter-hover);
            }

            .search-input::placeholder {
                color: var(--muted-light);
            }

            .count-badge {
                font-size: .8rem;
                color: var(--muted);
                margin-left: auto;
                white-space: nowrap;
            }

            .table-wrapper {
                background: var(--surface);
                border-radius: 12px;
                box-shadow: var(--shadow-card);
                overflow-x: auto;
                transition: background .2s ease;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: .88rem;
            }

            thead {
                position: sticky;
                top: 0;
                z-index: 2;
            }

            th {
                background: var(--surface-2);
                text-align: left;
                padding: 14px 16px;
                font-weight: 600;
                font-size: .78rem;
                text-transform: uppercase;
                letter-spacing: .5px;
                color: var(--muted-strong);
                border-bottom: 2px solid var(--border);
                white-space: nowrap;
            }

            td {
                padding: 12px 16px;
                border-bottom: 1px solid var(--border-soft);
                vertical-align: top;
            }

            tr:last-child td {
                border-bottom: none;
            }

            tbody tr {
                transition: background .12s;
            }

            tbody tr:hover {
                background: var(--row-hover);
            }

            .vacancy-link {
                color: var(--link);
                text-decoration: none;
                font-weight: 500;
            }

            .vacancy-link:hover {
                text-decoration: underline;
            }

            .title-cell {
                font-weight: 500;
                color: var(--text);
                max-width: 320px;
            }

            .company-cell {
                color: var(--muted-strong);
                font-size: .85rem;
                max-width: 200px;
            }

            .reason-cell {
                color: var(--muted);
                font-size: .82rem;
                max-width: 380px;
                line-height: 1.45;
            }

            .reason-cell.empty {
                color: var(--muted-empty);
                font-style: italic;
            }

            .time-cell {
                white-space: nowrap;
                font-size: .82rem;
                color: var(--muted-soft);
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: var(--muted-light);
                font-size: 1rem;
            }

            .empty-state .icon {
                font-size: 2.5rem;
                margin-bottom: 8px;
            }

            .loader {
                text-align: center;
                padding: 40px;
                color: var(--muted);
            }

            .loader .spinner {
                width: 32px;
                height: 32px;
                border: 3px solid var(--spinner-border);
                border-top-color: var(--spinner-top);
                border-radius: 50%;
                animation: spin .8s linear infinite;
                margin: 0 auto 12px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .error-box {
                background: #ffebee;
                color: #c62828;
                padding: 20px;
                border-radius: 12px;
                border-left: 4px solid #c62828;
                margin-bottom: 20px;
            }

            [data-theme="dark"] .error-box {
                background: #3a1a1c;
                color: #f08a8a;
                border-left-color: #f08a8a;
            }

            /* НОВЫЕ СТИЛИ ДЛЯ СЕЛЕКТА СТАТУСА */
            .status-select {
                padding: 6px 12px;
                border-radius: 20px;
                font-size: .78rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .3px;
                border: 1px solid transparent;
                cursor: pointer;
                outline: none;
                appearance: none;
                -webkit-appearance: none;
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 6px center;
                background-size: 12px;
                padding-right: 24px;
                transition: opacity 0.2s;
            }

            .status-select:disabled {
                opacity: 0.5;
                cursor: wait;
            }

            /* Цвета для селектов (светлая тема) */
            .status-select.sent {
                background-color: #e8f5e9;
                color: #2e7d32;
                border-color: #c8e6c9;
            }

            .status-select.skipped {
                background-color: #fff3e0;
                color: #e65100;
                border-color: #ffe0b2;
            }

            .status-select.queued {
                background-color: #e3f2fd;
                color: #1565c0;
                border-color: #bbdefb;
            }

            .status-select.excluded {
                background-color: #f3e5f5;
                color: #6a1b9a;
                border-color: #e1bee7;
            }

            .status-select.error {
                background-color: #ffebee;
                color: #c62828;
                border-color: #ffcdd2;
            }

            .status-select.rejected {
                background-color: #fce4ec;
                color: #ad1457;
                border-color: #f8bbd0;
            }

            /* Цвета для селектов (тёмная тема) */
            [data-theme="dark"] .status-select.sent {
                background-color: #1e3a24;
                color: #7fd18a;
                border-color: #2e5a38;
            }

            [data-theme="dark"] .status-select.skipped {
                background-color: #3a2a15;
                color: #f0b070;
                border-color: #5a3e22;
            }

            [data-theme="dark"] .status-select.queued {
                background-color: #142a44;
                color: #7fb6f0;
                border-color: #224e6c;
            }

            [data-theme="dark"] .status-select.excluded {
                background-color: #2b1a3a;
                color: #c39ae6;
                border-color: #462b5e;
            }

            [data-theme="dark"] .status-select.error {
                background-color: #3a1a1c;
                color: #f08a8a;
                border-color: #5e2a2c;
            }

            [data-theme="dark"] .status-select.rejected {
                background-color: #3a1a2b;
                color: #f08ab0;
                border-color: #5a2941;
            }

            @media (max-width: 768px) {
                body {
                    padding: 12px;
                }

                .header {
                    padding: 20px;
                }

                .header h1 {
                    font-size: 1.2rem;
                }

                .summary-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .summary-card .value {
                    font-size: 1.4rem;
                }

                .filters {
                    flex-direction: column;
                    align-items: stretch;
                }

                .count-badge {
                    margin-left: 0;
                }

                th, td {
                    padding: 10px 12px;
                }

                .title-cell, .company-cell, .reason-cell {
                    max-width: 220px;
                }
            }

            @media (max-width: 480px) {
                .summary-grid {
                    grid-template-columns: 1fr 1fr;
                    gap: 8px;
                }

                .summary-card {
                    padding: 12px 14px;
                }

                .summary-card .value {
                    font-size: 1.2rem;
                }

                .summary-card .label {
                    font-size: .7rem;
                }

                .filter-btn {
                    padding: 5px 12px;
                    font-size: .78rem;
                }
            }

            /* Выбор даты и файла в хедере: дропдаун с чекбоксами и обычный select. */
            .header-filters {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 12px;
                margin-top: 16px;
                font-size: .9rem;
            }

            .date-filter {
                position: relative;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .header-select {
                font: inherit;
                font-size: .9rem;
                color: var(--header-text);
                background: var(--btn-toggle-bg);
                border: 1px solid var(--btn-toggle-hover);
                border-radius: 8px;
                padding: 6px 12px;
                cursor: pointer;
                max-width: 320px;
            }

            .header-select:hover {
                background: var(--btn-toggle-hover);
            }

            .date-panel {
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                z-index: 20;
                min-width: 220px;
                max-height: 320px;
                overflow-y: auto;
                padding: 10px 12px;
                border-radius: 12px;
                background: var(--surface);
                color: var(--text);
                border: 1px solid var(--border);
                box-shadow: var(--shadow-card-hover);
            }

            .date-option {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 4px 0;
                font-size: .9rem;
                cursor: pointer;
            }

            .date-option input {
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="header-top">
                    <div>
                        <h1>📋 Отчёт по обработанным вакансиям</h1>
                        <div class="meta" id="headerMeta">Загрузка данных…</div>
                    </div>
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему"
                            title="Переключить тему">🌙
                    </button>
                </div>
                <div class="header-filters">
                    <div class="date-filter">
                        <button class="header-select" id="dateToggle" type="button" aria-expanded="false">
                            Дата: <span id="dateLabel">все даты</span> ▾
                        </button>
                        <div class="date-panel" id="datePanel" hidden>
                            <label class="date-option">
                                <input type="checkbox" id="dateAll" checked> Все даты
                            </label>
                            <div id="dateList"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="summary-grid" id="summaryGrid">
                <div class="summary-card card-sent">
                    <div class="label">Отклики</div>
                    <div class="value" id="sumSent">—</div>
                </div>
                <div class="summary-card card-queued">
                    <div class="label">В очереди</div>
                    <div class="value" id="sumQueued">—</div>
                </div>
                <div class="summary-card card-excluded">
                    <div class="label">Исключено</div>
                    <div class="value" id="sumExcluded">—</div>
                </div>
                <div class="summary-card card-skipped">
                    <div class="label">Не подходит</div>
                    <div class="value" id="sumSkipped">—</div>
                </div>
                <div class="summary-card card-sent">
                    <!-- TODO: сделать новый статус -->
                    <div class="label">Офферы</div>
                    <div class="value" id="sumOffered">0</div>
                </div>
                <div class="summary-card card-rejected">
                    <div class="label">Отказы</div>
                    <div class="value" id="sumRejected">—</div>
                </div>
                <div class="summary-card card-error">
                    <div class="label">Ошибки</div>
                    <div class="value" id="sumError">—</div>
                </div>
            </div>

            <div class="filters">
                <label>Фильтр:</label>
                <div class="filter-group" id="filterGroup">
                    <button class="filter-btn active" data-status="all">Все</button>
                    <button class="filter-btn" data-status="sent">Отправлено</button>
                    <button class="filter-btn" data-status="queued">В очереди</button>
                    <button class="filter-btn" data-status="excluded">Исключено</button>
                    <button class="filter-btn" data-status="skipped">Не подходит</button>
                    <button class="filter-btn" data-status="rejected">Отказ</button>
                    <button class="filter-btn" data-status="error">Ошибки</button>
                </div>
                <input type="text" class="search-input" id="searchInput"
                       placeholder="🔍 Поиск по названию, компании или причине...">
                <span class="count-badge" id="countBadge"></span>
            </div>

            <div class="table-wrapper">
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <div>Загрузка отчёта…</div>
                </div>
                <div class="error-box" id="errorBox" style="display:none;"></div>
                <table id="vacancyTable" style="display:none;">
                    <thead>
                    <tr>
                        <th>Вакансия</th>
                        <th>Компания</th>
                        <th>Статус</th>
                        <th>Причина / Комментарий</th>
                        <th>Время</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <div class="icon">🔍</div>
                    <div>Ничего не найдено. Попробуйте изменить фильтр или поисковый запрос.</div>
                </div>
            </div>
        </div>

        <script>
            /* ---------- Тема ---------- */
            const THEME_KEY = 'vacancy-report-theme';

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const btn = document.getElementById('themeToggle');
                if (btn) {
                    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
                    btn.setAttribute('aria-label', theme === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему');
                }
            }

            function getPreferredTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'dark' || saved === 'light') return saved;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            applyTheme(getPreferredTheme());
            document.getElementById('themeToggle').addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                localStorage.setItem(THEME_KEY, next);
            });

            /* ---------- Глобальные переменные ---------- */
            const STATUS_LABELS = {
                sent: 'Отправлено',
                skipped: 'Пропущено',
                queued: 'В очереди',
                excluded: 'Исключено',
                error: 'Ошибка',
                rejected: 'Отказ'
            };
            let allVacancies = [];
            let currentStatus = 'all';
            let currentQuery = '';
            let selectedFiles = [];      // выбранные даты = файлы дня ([] — все файлы)
            let reportsIndex = [];       // файлы дня: имя, дата, обновление, итоги

            const els = {
                headerMeta: document.getElementById('headerMeta'),
                sumSent: document.getElementById('sumSent'),
                sumSkipped: document.getElementById('sumSkipped'),
                sumQueued: document.getElementById('sumQueued'),
                sumExcluded: document.getElementById('sumExcluded'),
                sumError: document.getElementById('sumError'),
                sumRejected: document.getElementById('sumRejected'),
                loader: document.getElementById('loader'),
                errorBox: document.getElementById('errorBox'),
                table: document.getElementById('vacancyTable'),
                tableBody: document.getElementById('tableBody'),
                emptyState: document.getElementById('emptyState'),
                countBadge: document.getElementById('countBadge'),
                searchInput: document.getElementById('searchInput'),
                filterGroup: document.getElementById('filterGroup'),
                dateToggle: document.getElementById('dateToggle'),
                dateLabel: document.getElementById('dateLabel'),
                datePanel: document.getElementById('datePanel'),
                dateAll: document.getElementById('dateAll'),
                dateList: document.getElementById('dateList')
            };

            /* ---------- Утилиты ---------- */
            function formatDate(iso) {
                if (!iso) return '—';
                try {
                    return new Date(iso).toLocaleDateString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });
                } catch {
                    return iso;
                }
            }

            function formatTime(iso) {
                if (!iso) return '—';
                try {
                    return new Date(iso).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
                } catch {
                    return iso;
                }
            }

            function escapeHtml(s) {
                if (s == null) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            /* ---------- Отрисовка ---------- */
            function renderSummary(summary) {
                const s = summary || {};
                els.sumSent.textContent = s.sent ?? 0;
                els.sumSkipped.textContent = s.skipped ?? 0;
                els.sumQueued.textContent = s.queued ?? 0;
                els.sumExcluded.textContent = s.excluded ?? 0;
                els.sumError.textContent = s.error ?? 0;
                els.sumRejected.textContent = s.rejected ?? 0;
            }

            function renderHeader(data) {
                const updated = data.updated_at ? new Date(data.updated_at).toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : '—';
                const total = Array.isArray(data.vacancies) ? data.vacancies.length : 0;
                els.headerMeta.textContent = `Обновлено: ${updated} · Всего обработано ${total} вакансий`;
            }

            function renderTable() {
                const q = currentQuery.trim().toLowerCase();
                const filtered = allVacancies.filter(v => {
                    if (currentStatus !== 'all' && v.status !== currentStatus) return false;
                    if (!q) return true;
                    return [v.title, v.company, v.reason, v.url].filter(Boolean).join(' ').toLowerCase().includes(q);
                });

                els.tableBody.innerHTML = '';
                els.countBadge.textContent = `Показано ${filtered.length} из ${allVacancies.length}`;

                if (filtered.length === 0) {
                    els.emptyState.style.display = 'block';
                    els.table.style.display = 'none';
                    return;
                }
                els.emptyState.style.display = 'none';
                els.table.style.display = 'table';

                const frag = document.createDocumentFragment();
                for (const v of filtered) {
                    const tr = document.createElement('tr');

                    // Вакансия
                    const tdTitle = document.createElement('td');
                    tdTitle.className = 'title-cell';
                    if (v.url) {
                        const a = document.createElement('a');
                        a.className = 'vacancy-link';
                        a.href = v.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.textContent = v.title || '(без названия)';
                        tdTitle.appendChild(a);
                    } else {
                        tdTitle.textContent = v.title || '(без названия)';
                    }
                    tr.appendChild(tdTitle);

                    // Компания
                    const tdCompany = document.createElement('td');
                    tdCompany.className = 'company-cell';
                    tdCompany.textContent = v.company || '—';
                    tr.appendChild(tdCompany);

                    // Статус (ВЫПАДАЮЩИЙ СПИСОК)
                    const tdStatus = document.createElement('td');
                    const select = document.createElement('select');
                    select.className = 'status-select ' + (v.status || 'skipped');
                    select.dataset.url = v.url;
                    select.dataset.report = v.report_name || '';

                    // Опции
                    for (const [key, label] of Object.entries(STATUS_LABELS)) {
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = label;
                        if (v.status === key) opt.selected = true;
                        select.appendChild(opt);
                    }

                    // Обработчик смены статуса
                    select.addEventListener('change', async (e) => {
                        const newStatus = e.target.value;
                        const url = e.target.dataset.url;
                        const reportName = e.target.dataset.report;

                        // Блокируем на время запроса
                        e.target.disabled = true;
                        const oldClass = e.target.className;
                        e.target.className = 'status-select ' + newStatus;

                        try {
                            const resp = await fetch('/api/v1/update-status', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({
                                    report_name: reportName,
                                    url: url,
                                    status: newStatus
                                })
                            });

                            if (!resp.ok) throw new Error('Ошибка сервера');
                            const result = await resp.json();

                            // Обновляем локальные данные
                            const vac = allVacancies.find(x => x.url === url && x.report_name === reportName);
                            if (vac) {
                                vac.status = newStatus;
                                if (result.attempts !== undefined) vac.attempts = result.attempts;
                                if (result.reason !== undefined) vac.reason = result.reason;
                                if (result.processed_at) vac.processed_at = result.processed_at;
                            }

                            // Обновляем сводку из ответа сервера
                            if (result.summary) renderSummary(result.summary);

                            // Перерисовываем таблицу, чтобы применить фильтры (если нужно)
                            renderTable(); // Если раскомментировать, строка может исчезнуть, если выбран фильтр по старому статусу.

                        } catch (err) {
                            alert('Не удалось сохранить статус: ' + err.message);
                            e.target.value = v.status; // Откатываем
                            e.target.className = oldClass;
                        } finally {
                            e.target.disabled = false;
                        }
                    });

                    tdStatus.appendChild(select);
                    tr.appendChild(tdStatus);

                    // Причина
                    const tdReason = document.createElement('td');
                    tdReason.className = 'reason-cell' + (v.reason ? '' : ' empty');
                    tdReason.textContent = v.reason || '—';
                    tr.appendChild(tdReason);

                    // Время
                    const tdTime = document.createElement('td');
                    tdTime.className = 'time-cell';
                    tdTime.textContent = formatTime(v.processed_at);
                    tr.appendChild(tdTime);

                    frag.appendChild(tr);
                }
                els.tableBody.appendChild(frag);
            }

            /* ---------- Обработчики ---------- */
            els.filterGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                els.filterGroup.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStatus = btn.dataset.status;
                renderTable();
            });

            els.searchInput.addEventListener('input', (e) => {
                currentQuery = e.target.value;
                renderTable();
            });

            /* Дропдаун «Дата»: чекбоксы по датам в едином стиле с фильтрами. */
            els.dateToggle.addEventListener('click', () => {
                const nextHidden = !els.datePanel.hidden;
                els.datePanel.hidden = nextHidden;
                els.dateToggle.setAttribute('aria-expanded', String(!nextHidden));
            });

            document.addEventListener('click', (event) => {
                const inside = event.target instanceof Element && event.target.closest('.date-filter');
                if (!els.datePanel.hidden && !inside) {
                    els.datePanel.hidden = true;
                    els.dateToggle.setAttribute('aria-expanded', 'false');
                }
            });

            els.dateAll.addEventListener('change', async () => {
                selectedFiles = [];
                renderDateOptions();
                await loadVacancies();
            });

            /* ---------- Выбор даты: под капотом это файлы дня ---------- */
            function dateLabelText() {
                if (selectedFiles.length === 0) return 'все даты';
                if (selectedFiles.length === 1) {
                    const report = reportsIndex.find(item => item.name === selectedFiles[0]);
                    return report ? report.date : selectedFiles[0];
                }
                return `${selectedFiles.length} дат`;
            }

            function renderDateOptions() {
                els.dateList.innerHTML = '';
                for (const report of reportsIndex) {
                    const label = document.createElement('label');
                    label.className = 'date-option';
                    const box = document.createElement('input');
                    box.type = 'checkbox';
                    // Дата и файл дня — одно и то же: значение чекбокса — имя файла.
                    box.value = report.name;
                    box.checked = selectedFiles.length === 0 || selectedFiles.includes(report.name);
                    box.addEventListener('change', onDateChange);
                    label.appendChild(box);
                    label.appendChild(document.createTextNode(` ${report.date} (${report.total})`));
                    els.dateList.appendChild(label);
                }
                els.dateAll.checked = selectedFiles.length === 0;
                els.dateLabel.textContent = dateLabelText();
            }

            async function onDateChange() {
                const boxes = Array.from(els.dateList.querySelectorAll('input[type=checkbox]'));
                selectedFiles = boxes.filter(box => box.checked).map(box => box.value);
                // Отмечены все даты — это то же самое, что «все даты».
                if (boxes.length && selectedFiles.length === boxes.length) selectedFiles = [];
                renderDateOptions();
                await loadVacancies();
            }

            /* ---------- Загрузка данных с сервера ---------- */
            async function loadReports() {
                const resp = await fetch('/api/v1/reports');
                if (!resp.ok) throw new Error('Не удалось получить список отчётов');
                const data = await resp.json();
                reportsIndex = Array.isArray(data.reports) ? data.reports : [];
                if (reportsIndex.length === 0) {
                    throw new Error('В папке data/report нет ни одного JSON-файла');
                }
                renderDateOptions();
            }

            async function loadVacancies() {
                els.loader.style.display = 'block';
                els.errorBox.style.display = 'none';
                const query = selectedFiles.length
                    ? `?files=${encodeURIComponent(selectedFiles.join(','))}`
                    : '';
                const resp = await fetch(`/api/v1/vacancies${query}`);
                if (!resp.ok) throw new Error(`Ошибка HTTP ${resp.status}`);
                const data = await resp.json();

                allVacancies = Array.isArray(data.vacancies) ? data.vacancies : [];
                renderSummary(data.summary);

                const dates = selectedFiles.length
                    ? reportsIndex.filter(report => selectedFiles.includes(report.name))
                    : reportsIndex;
                const updated = dates
                    .map(report => report.updated_at || '')
                    .sort()
                    .pop() || '';
                renderHeader({updated_at: updated, vacancies: allVacancies});

                els.loader.style.display = 'none';
                renderTable();
            }

            async function init() {
                try {
                    await loadReports();
                    await loadVacancies();
                } catch (err) {
                    els.loader.style.display = 'none';
                    els.errorBox.style.display = 'block';
                    els.errorBox.innerHTML = `<strong>Ошибка загрузки данных.</strong><br>Причина: ${escapeHtml(err.message)}<br><br>Убедитесь, что сервер FastAPI запущен.`;
                    console.error(err);
                }
            }

            init();
        </script>
    </body>
</html>
