# Конфигурация агента автоматических откликов на hh.ru.
# Каждый параметр описан комментарием рядом — отдельного справочника нет.
#
# Этот файл лежит в git: здесь только структура и поведение, без личных данных.
# Персональное (поисковые запросы, стоп-слова, подпись с контактами, название резюме,
# адреса писем) — в config.local.yaml рядом с этим файлом. Он в .gitignore;
# шаблон — config.local.example.yaml. Значения из config.local.yaml перекрывают
# одноимённые ключи этого файла, переменные окружения перекрывают оба файла.
#
# Разделы повторяют схему agent/config.py: search → pipeline → data → llm →
# browser → notifications.

search:
  # Канал поиска: hh (поиск по запросам) или habr (лента «Подходящие»).
  # Для habr запросы, регион и фильтры hh.ru не нужны.
  channel: hh
  # Поисковые запросы (search.queries) — личное: в config.local.yaml.
  # Регион: название (Москва, Санкт-Петербург, Россия, Екатеринбург, Новосибирск, Казань)
  # или числовой id региона hh.ru (Москва — 1, Россия — 113).
  # Таблица частых регионов, включая Московскую область и Пушкино:
  # docs/configuration.md → раздел «Регионы».
  area: Москва
  # Минимальная зарплата (необязательно).
  #salary_from: 150000
  # Опыт работы (необязательно): одно значение или список значений —
  # noExperience, between1And3, between3And6, moreThan6.
  # Список = несколько отмеченных чекбоксов в фильтре «Опыт» на hh.ru:
  # значения уходят в URL повторяющимся параметром experience.
  experience:
    - noExperience
    - between1And3
    - between3And6
  # График (необязательно): fullDay, shift, flexible, remote, flyInFlyOut.
  #schedule: remote
  # Стоп-слова и компании-исключения — личное: в config.local.yaml.
  # Сколько карточек запрашивать со страницы выдачи.
  # hh.ru понимает 20, 50 и 100 и отдаёт ровно столько, сколько попросили.
  per_page: 100
  # Сколько страниц выдачи просматривать по каждому запросу.
  # Не задано — считаем сами по числу найденных: «546 вакансий» при per_page: 100 — 6 страниц.
  # Число ограничивает глубину вручную; предохранитель в коде — не больше 50 страниц.
  #pages_limit: 10

pipeline:
  # Подъём резюме в поиске сразу после старта.
  resume:
    # Название резюме (pipeline.resume.name) — личное: в config.local.yaml.
    # Обязательно для hh: по нему выбирается резюме в отклике и поднимается
    # резюме в поиске. Пусто — запуск hh останавливается.
    boost_interval_hours: 4
  # Максимум отправленных откликов за один запуск.
  limit_per_run: 50
  # Случайная пауза между действиями, секунды.
  delay_between_actions:
    from: 60
    to: 120
  # Предохранитель: максимум просмотренных вакансий за запуск.
  max_vacancies: 1000
  # Повторная обработка по дневным отчётам (справка по командам запуска: py run.py --help).
  # Идём сразу по ссылкам из отчётов, без поиска и фильтрации выдачи.
  retry:
    # Статусы, которые повторяем по умолчанию (--retry без аргумента):
    # error — сбой обработки
    # queued — тест/анкета/капча
    # excluded — стоп-слово в названии или компания из search.exclude_companies
    #            (уберите слово или компанию из списка перед запуском)
    # skipped — не подошло по мнению LLM (например, после смены порога)
    statuses:
      - error

data:
  # Сколько дней хранить журналы и скриншоты в logs. Старше — удаляются при старте.
  # Дневные отчёты (data/report) не удаляются никогда: это история для аналитики.
  logs_retention_days: 7
  # Локальные данные: профиль, сессия, кэш подъёма резюме и дневные отчёты о вакансиях.
  paths:
    profile: data/profile.md
    # Сессия hh.ru (ключ прежний, файл переименован).
    session_state: data/hh-state.json
    # Сессия career.habr.com и постоянный профиль Chrome для hCaptcha.
    habr_session_state: data/habr-state.json
    habr_profile: data/habr-profile
    # Кэш служебных данных: когда последний раз поднимали резюме в поиске.
    cache: data/cache.json
    # Дневные отчёты по вакансиям: файл на дату, повторно эти вакансии не проходим.
    report_dir: data/report
    logs_dir: logs

# LLM: два независимых вызова (решение и генерация письма).
llm:
  api_key_env: AITUNNEL_API_KEY
  base_url: https://api.aitunnel.ru/v1
  timeout_seconds: 45

  # Системный промпт: единственный источник правил оценки и написания письма.
  # Правится без изменения кода; если файла нет — запуск остановится с ошибкой.
  system_prompt_path: SYSTEM_PROMPT.md

  # Decision-вызов: модель решений, ответ — вероятности вариантов.
  decision:
    model: gpt-6-luna-decisions
    # Порог: отклик отправляется, если P("подходит") > threshold.
    threshold: 0.8
    # Критерии, которые уходят в модель решений. Здесь единственное место,
    # где описан порог соответствия — в SYSTEM_PROMPT.md этих чисел нет.
    criteria:
      подходит: "Требования, обязанности, стек и условия вакансии совпадают с профилем не менее чем на 70%, красных флагов нет"
      не подходит: "Совпадение по ключевым требованиям менее 70%, другая специализация или есть красные флаги"
    # Объяснять отказы отдельным дешёвым Chat-запросом (1 предложение, до 120 токенов).
    # false — в логе будет причина, посчитанная из вероятностей (бесплатно).
    explain_rejections: true

  # Generation-вызов: чат-модель, ответ — JSON с вердиктом и письмом.
  generation:
    model: gpt-6-luna-pro
    max_tokens: 2000
    # Чуть выше 0 — письма живее; достоверность держат правила в SYSTEM_PROMPT.md.
    temperature: 0.4
    # Запрашивать у провайдера JSON-режим ответа (response_format).
    json_mode: false
    # Повторная попытка при невалидном JSON (по ТЗ — ровно один повтор).
    retry_on_invalid_json: true

  # Сопроводительное письмо: лимит длины и подпись.
  cover_letter:
    max_length: 1500
    # Подпись с контактами (llm.cover_letter.signature) — личное: в config.local.yaml.
    # Дописывается кодом через пустую строку и считается в max_length.
    # Ссылки на проекты (llm.cover_letter.pet-projects) — личное: в config.local.yaml.
    # Нужны, если вакансия просит приложить ссылки на проекты в письме.

browser:
  # false — браузер виден (рекомендуется: проще пройти капчу/проверить работу).
  headless: false
  slow_mo_ms: 0
  # Использовать установленный браузер вместо Chromium из Playwright:
  # chrome, msedge, chrome-beta и т.п. Пустое значение ("") — Chromium,
  # который ставится командой: python run.py --install-browser
  channel: chrome
  # Sandbox Chromium. Playwright по умолчанию его отключает (--no-sandbox),
  # и браузер предупреждает о стабильности и безопасности.
  # false — только если Chromium не стартует: запуск от root или Linux без userns.
  chromium_sandbox: true
  # Сколько секунд ждать, пока вы вручную решите капчу в открытом окне браузера.
  # Капча не обходится: приложение только ждёт (0 — не ждать, отложить вакансию).
  # В headless-режиме окна нет, поэтому ожидание не включается.
  captcha_wait_seconds: 3600

# Письма на email: общий SMTP-канал и раздельные переключатели видов писем.
# Пароль приложения (не пароль аккаунта) — SMTP_PASSWORD в .env;
# адреса sender/recipient и SMTP_USERNAME — в config.local.yaml.
# Проверка канала: python run.py --notify-test (письмо на каждый включённый вид).
notifications:
  # Общий транспорт для всех писем.
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 465
    use_ssl: true
    # sender, recipient — в config.local.yaml

  # Письмо с отчётом после запуска.
  report:
    enabled: true

  # Письма о капче: одно письмо на капчу, чтобы успеть вмешаться.
  captcha:
    enabled: true
    # recipient: "другой@адрес"  # пусто — общий notifications.email.recipient
