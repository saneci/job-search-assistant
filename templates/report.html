<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>Отчёт по вакансиям</title>
        <style>
            :root {
                --bg: #f0f2f5;
                --text: #1a1a2e;
                --surface: #fff;
                --surface-2: #f8f9fb;
                --border: #e8eaed;
                --border-soft: #f0f0f0;
                --muted: #666;
                --muted-strong: #555;
                --muted-soft: #777;
                --muted-light: #999;
                --muted-empty: #aaa;
                --link: #1565c0;
                --filter-border: #d0d5dd;
                --filter-bg: #fff;
                --filter-text: #444;
                --filter-hover: #2d5a87;
                --filter-active-bg: #1e3a5f;
                --filter-active-text: #fff;
                --row-hover: #f5f8ff;
                --header-grad: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
                --header-text: #fff;
                --shadow-card: 0 2px 8px rgba(0, 0, 0, .06);
                --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .1);
                --shadow-header: 0 4px 16px rgba(0, 0, 0, .12);
                --spinner-border: #e0e0e0;
                --spinner-top: #2d5a87;
                --btn-toggle-bg: rgba(255, 255, 255, .15);
                --btn-toggle-hover: rgba(255, 255, 255, .3);
            }

            [data-theme="dark"] {
                --bg: #0f1620;
                --text: #e6edf3;
                --surface: #16202b;
                --surface-2: #1c2733;
                --border: #2a3744;
                --border-soft: #223040;
                --muted: #9aa7b4;
                --muted-strong: #b6c2ce;
                --muted-soft: #8b98a5;
                --muted-light: #7a8794;
                --muted-empty: #5f6b78;
                --link: #6ab0f3;
                --filter-border: #33465a;
                --filter-bg: #1c2733;
                --filter-text: #cdd6df;
                --filter-hover: #6ab0f3;
                --filter-active-bg: #2d5a87;
                --filter-active-text: #fff;
                --row-hover: #1e2b3a;
                --header-grad: linear-gradient(135deg, #0b1a2a 0%, #17324d 100%);
                --header-text: #e6edf3;
                --shadow-card: 0 2px 8px rgba(0, 0, 0, .4);
                --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .55);
                --shadow-header: 0 4px 16px rgba(0, 0, 0, .5);
                --spinner-border: #2a3744;
                --spinner-top: #6ab0f3;
                --btn-toggle-bg: rgba(255, 255, 255, .1);
                --btn-toggle-hover: rgba(255, 255, 255, .22);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                padding: 24px;
                line-height: 1.5;
                transition: background .2s ease, color .2s ease;
            }

            .container {
                max-width: 1440px;
                margin: 0 auto;
            }

            .header {
                background: var(--header-grad);
                color: var(--header-text);
                padding: 28px 32px;
                border-radius: 16px;
                margin-bottom: 24px;
                box-shadow: var(--shadow-header);
                transition: background .2s ease;
            }

            .header-top {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 16px;
            }

            .header h1 {
                font-size: 1.6rem;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .header .meta {
                font-size: .9rem;
                opacity: .85;
            }

            .theme-toggle {
                flex-shrink: 0;
                width: 40px;
                height: 40px;
                border: none;
                border-radius: 50%;
                background: var(--btn-toggle-bg);
                color: var(--header-text);
                font-size: 1.2rem;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: background .15s ease, transform .15s ease;
            }

            .theme-toggle:hover {
                background: var(--btn-toggle-hover);
                transform: scale(1.05);
            }

            .theme-toggle:active {
                transform: scale(.95);
            }

            .summary-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
                margin-bottom: 24px;
            }

            .summary-card {
                background: var(--surface);
                border-radius: 12px;
                padding: 16px 20px;
                box-shadow: var(--shadow-card);
                border-left: 4px solid #ccc;
                transition: transform .15s, box-shadow .15s, background .2s ease;
            }

            .summary-card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-card-hover);
            }

            .summary-card .label {
                font-size: .8rem;
                text-transform: uppercase;
                letter-spacing: .5px;
                color: var(--muted);
                font-weight: 600;
            }

            .summary-card .value {
                font-size: 1.8rem;
                font-weight: 700;
                margin-top: 4px;
            }

            .card-sent {
                border-left-color: #2e7d32;
            }

            .card-sent .value {
                color: #2e7d32;
            }

            .card-skipped {
                border-left-color: #e65100;
            }

            .card-skipped .value {
                color: #e65100;
            }

            .card-queued {
                border-left-color: #1565c0;
            }

            .card-queued .value {
                color: #1565c0;
            }

            .card-excluded {
                border-left-color: #6a1b9a;
            }

            .card-excluded .value {
                color: #6a1b9a;
            }

            .card-error {
                border-left-color: #c62828;
            }

            .card-error .value {
                color: #c62828;
            }

            .filters {
                background: var(--surface);
                border-radius: 12px;
                padding: 16px 20px;
                margin-bottom: 20px;
                box-shadow: var(--shadow-card);
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
                transition: background .2s ease;
            }

            .filters label {
                font-size: .85rem;
                font-weight: 600;
                color: var(--muted-strong);
            }

            .filter-group {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }

            .filter-btn {
                padding: 6px 16px;
                border: 1.5px solid var(--filter-border);
                border-radius: 20px;
                background: var(--filter-bg);
                cursor: pointer;
                font-size: .85rem;
                font-weight: 500;
                color: var(--filter-text);
                transition: all .15s;
                white-space: nowrap;
            }

            .filter-btn:hover {
                border-color: var(--filter-hover);
                color: var(--filter-hover);
            }

            .filter-btn.active {
                background: var(--filter-active-bg);
                color: var(--filter-active-text);
                border-color: var(--filter-active-bg);
            }

            .search-input {
                flex: 1;
                min-width: 200px;
                padding: 8px 16px;
                border: 1.5px solid var(--filter-border);
                border-radius: 20px;
                font-size: .85rem;
                outline: none;
                transition: border-color .15s, background .2s ease, color .2s ease;
                background: var(--filter-bg);
                color: var(--text);
            }

            .search-input:focus {
                border-color: var(--filter-hover);
            }

            .search-input::placeholder {
                color: var(--muted-light);
            }

            .count-badge {
                font-size: .8rem;
                color: var(--muted);
                margin-left: auto;
                white-space: nowrap;
            }

            .table-wrapper {
                background: var(--surface);
                border-radius: 12px;
                box-shadow: var(--shadow-card);
                overflow-x: auto;
                transition: background .2s ease;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: .88rem;
            }

            thead {
                position: sticky;
                top: 0;
                z-index: 2;
            }

            th {
                background: var(--surface-2);
                text-align: left;
                padding: 14px 16px;
                font-weight: 600;
                font-size: .78rem;
                text-transform: uppercase;
                letter-spacing: .5px;
                color: var(--muted-strong);
                border-bottom: 2px solid var(--border);
                white-space: nowrap;
            }

            td {
                padding: 12px 16px;
                border-bottom: 1px solid var(--border-soft);
                vertical-align: top;
            }

            tr:last-child td {
                border-bottom: none;
            }

            tbody tr {
                transition: background .12s;
            }

            tbody tr:hover {
                background: var(--row-hover);
            }

            .vacancy-link {
                color: var(--link);
                text-decoration: none;
                font-weight: 500;
            }

            .vacancy-link:hover {
                text-decoration: underline;
            }

            .status-badge {
                display: inline-block;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: .78rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .3px;
                white-space: nowrap;
            }

            .badge-sent {
                background: #e8f5e9;
                color: #2e7d32;
            }

            .badge-skipped {
                background: #fff3e0;
                color: #e65100;
            }

            .badge-queued {
                background: #e3f2fd;
                color: #1565c0;
            }

            .badge-excluded {
                background: #f3e5f5;
                color: #6a1b9a;
            }

            .badge-error {
                background: #ffebee;
                color: #c62828;
            }

            [data-theme="dark"] .badge-sent {
                background: #1e3a24;
                color: #7fd18a;
            }

            [data-theme="dark"] .badge-skipped {
                background: #3a2a15;
                color: #f0b070;
            }

            [data-theme="dark"] .badge-queued {
                background: #142a44;
                color: #7fb6f0;
            }

            [data-theme="dark"] .badge-excluded {
                background: #2b1a3a;
                color: #c39ae6;
            }

            [data-theme="dark"] .badge-error {
                background: #3a1a1c;
                color: #f08a8a;
            }

            .title-cell {
                font-weight: 500;
                color: var(--text);
                max-width: 320px;
            }

            .company-cell {
                color: var(--muted-strong);
                font-size: .85rem;
                max-width: 200px;
            }

            .reason-cell {
                color: var(--muted);
                font-size: .82rem;
                max-width: 380px;
                line-height: 1.45;
            }

            .reason-cell.empty {
                color: var(--muted-empty);
                font-style: italic;
            }

            .time-cell {
                white-space: nowrap;
                font-size: .82rem;
                color: var(--muted-soft);
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: var(--muted-light);
                font-size: 1rem;
            }

            .empty-state .icon {
                font-size: 2.5rem;
                margin-bottom: 8px;
            }

            .loader {
                text-align: center;
                padding: 40px;
                color: var(--muted);
            }

            .loader .spinner {
                width: 32px;
                height: 32px;
                border: 3px solid var(--spinner-border);
                border-top-color: var(--spinner-top);
                border-radius: 50%;
                animation: spin .8s linear infinite;
                margin: 0 auto 12px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .error-box {
                background: #ffebee;
                color: #c62828;
                padding: 20px;
                border-radius: 12px;
                border-left: 4px solid #c62828;
                margin-bottom: 20px;
            }

            [data-theme="dark"] .error-box {
                background: #3a1a1c;
                color: #f08a8a;
                border-left-color: #f08a8a;
            }

            @media (max-width: 768px) {
                body {
                    padding: 12px;
                }

                .header {
                    padding: 20px;
                }

                .header h1 {
                    font-size: 1.2rem;
                }

                .summary-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .summary-card .value {
                    font-size: 1.4rem;
                }

                .filters {
                    flex-direction: column;
                    align-items: stretch;
                }

                .count-badge {
                    margin-left: 0;
                }

                th, td {
                    padding: 10px 12px;
                }

                .title-cell, .company-cell, .reason-cell {
                    max-width: 220px;
                }
            }

            @media (max-width: 480px) {
                .summary-grid {
                    grid-template-columns: 1fr 1fr;
                    gap: 8px;
                }

                .summary-card {
                    padding: 12px 14px;
                }

                .summary-card .value {
                    font-size: 1.2rem;
                }

                .summary-card .label {
                    font-size: .7rem;
                }

                .filter-btn {
                    padding: 5px 12px;
                    font-size: .78rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="header-top">
                    <div>
                        <h1>📋 Отчёт по обработанным вакансиям</h1>
                        <div class="meta" id="headerMeta">Загрузка данных…</div>
                    </div>
                    <button class="theme-toggle" id="themeToggle"
                            type="button" aria-label="Переключить тему" title="Переключить тему">
                        🌙
                    </button>
                </div>
            </div>

            <div class="summary-grid" id="summaryGrid">
                <div class="summary-card card-sent">
                    <div class="label">Отправлено откликов</div>
                    <div class="value" id="sumSent">—</div>
                </div>
                <div class="summary-card card-skipped">
                    <div class="label">Пропущено</div>
                    <div class="value" id="sumSkipped">—</div>
                </div>
                <div class="summary-card card-queued">
                    <div class="label">В очереди</div>
                    <div class="value" id="sumQueued">—</div>
                </div>
                <div class="summary-card card-excluded">
                    <div class="label">Исключено</div>
                    <div class="value" id="sumExcluded">—</div>
                </div>
                <div class="summary-card card-error">
                    <div class="label">Ошибки</div>
                    <div class="value" id="sumError">—</div>
                </div>
            </div>

            <div class="filters">
                <label>Фильтр:</label>
                <div class="filter-group" id="filterGroup">
                    <button class="filter-btn active" data-status="all">Все</button>
                    <button class="filter-btn" data-status="sent">Отправлено</button>
                    <button class="filter-btn" data-status="skipped">Пропущено</button>
                    <button class="filter-btn" data-status="queued">В очереди</button>
                    <button class="filter-btn" data-status="excluded">Исключено</button>
                    <button class="filter-btn" data-status="error">Ошибки</button>
                </div>
                <input type="text" class="search-input" id="searchInput"
                       placeholder="🔍 Поиск по названию, компании или причине...">
                <span class="count-badge" id="countBadge"></span>
            </div>

            <div class="table-wrapper">
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <div>Загрузка отчёта…</div>
                </div>
                <div class="error-box" id="errorBox" style="display:none;"></div>
                <table id="vacancyTable" style="display:none;">
                    <thead>
                    <tr>
                        <th>Вакансия</th>
                        <th>Компания</th>
                        <th>Статус</th>
                        <th>Причина / Комментарий</th>
                        <th>Время</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <div class="icon">🔍</div>
                    <div>Ничего не найдено. Попробуйте изменить фильтр или поисковый запрос.</div>
                </div>
            </div>
        </div>

        <script>
            /* ---------- Тема ---------- */
            const THEME_KEY = 'vacancy-report-theme';

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const btn = document.getElementById('themeToggle');
                if (btn) {
                    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
                    btn.setAttribute('aria-label',
                        theme === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему');
                }
            }

            function getPreferredTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'dark' || saved === 'light') return saved;
                return window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light';
            }

            // Применяем как можно раньше, чтобы не было «мигания»
            applyTheme(getPreferredTheme());

            document.getElementById('themeToggle').addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                localStorage.setItem(THEME_KEY, next);
            });

            /* =========================================================================
               Загружаем данные из соседнего файла YYYY-dd-mm.json
               ========================================================================= */
            const DATA_FILE = '2026-10-23.json';

            const STATUS_LABELS = {
                sent: 'Отправлено',
                skipped: 'Пропущено',
                queued: 'В очереди',
                excluded: 'Исключено',
                error: 'Ошибка'
            };

            let allVacancies = [];
            let currentStatus = 'all';
            let currentQuery = '';

            const els = {
                headerMeta: document.getElementById('headerMeta'),
                sumSent: document.getElementById('sumSent'),
                sumSkipped: document.getElementById('sumSkipped'),
                sumQueued: document.getElementById('sumQueued'),
                sumExcluded: document.getElementById('sumExcluded'),
                sumError: document.getElementById('sumError'),
                loader: document.getElementById('loader'),
                errorBox: document.getElementById('errorBox'),
                table: document.getElementById('vacancyTable'),
                tableBody: document.getElementById('tableBody'),
                emptyState: document.getElementById('emptyState'),
                countBadge: document.getElementById('countBadge'),
                searchInput: document.getElementById('searchInput'),
                filterGroup: document.getElementById('filterGroup')
            };

            /* ---------- Утилиты ---------- */
            function formatDate(iso) {
                if (!iso) return '—';
                try {
                    const d = new Date(iso);
                    return d.toLocaleDateString('ru-RU', {
                        day: '2-digit', month: '2-digit', year: 'numeric'
                    });
                } catch {
                    return iso;
                }
            }

            function formatTime(iso) {
                if (!iso) return '—';
                try {
                    const d = new Date(iso);
                    return d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
                } catch {
                    return iso;
                }
            }

            function escapeHtml(s) {
                if (s == null) return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            /* ---------- Отрисовка ---------- */
            function renderSummary(summary) {
                const s = summary || {};
                els.sumSent.textContent = s.sent ?? 0;
                els.sumSkipped.textContent = s.skipped ?? 0;
                els.sumQueued.textContent = s.queued ?? 0;
                els.sumExcluded.textContent = s.excluded ?? 0;
                els.sumError.textContent = s.error ?? 0;
            }

            function renderHeader(data) {
                const date = data.date || '—';
                const updated = data.updated_at
                    ? new Date(data.updated_at).toLocaleString('ru-RU', {
                        day: '2-digit', month: 'long', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    })
                    : '—';

                const total = Array.isArray(data.vacancies) ? data.vacancies.length : 0;

                els.headerMeta.textContent =
                    `Дата: ${formatDate(date)} · Обновлено: ${updated} · Всего обработано ${total} вакансий`;
            }

            function renderTable() {
                const q = currentQuery.trim().toLowerCase();
                const filtered = allVacancies.filter(v => {
                    if (currentStatus !== 'all' && v.status !== currentStatus) return false;
                    if (!q) return true;
                    const hay = [
                        v.title, v.company, v.reason, v.url
                    ].filter(Boolean).join(' ').toLowerCase();
                    return hay.includes(q);
                });

                els.tableBody.innerHTML = '';
                els.countBadge.textContent =
                    `Показано ${filtered.length} из ${allVacancies.length}`;

                if (filtered.length === 0) {
                    els.emptyState.style.display = 'block';
                    els.table.style.display = 'none';
                    return;
                }
                els.emptyState.style.display = 'none';
                els.table.style.display = 'table';

                const frag = document.createDocumentFragment();
                for (const v of filtered) {
                    const tr = document.createElement('tr');

                    // Вакансия
                    const tdTitle = document.createElement('td');
                    tdTitle.className = 'title-cell';
                    if (v.url) {
                        const a = document.createElement('a');
                        a.className = 'vacancy-link';
                        a.href = v.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.textContent = v.title || '(без названия)';
                        tdTitle.appendChild(a);
                    } else {
                        tdTitle.textContent = v.title || '(без названия)';
                    }
                    tr.appendChild(tdTitle);

                    // Компания
                    const tdCompany = document.createElement('td');
                    tdCompany.className = 'company-cell';
                    tdCompany.textContent = v.company || '—';
                    tr.appendChild(tdCompany);

                    // Статус
                    const tdStatus = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = 'status-badge badge-' + (v.status || 'skipped');
                    badge.textContent = STATUS_LABELS[v.status] || v.status || '—';
                    tdStatus.appendChild(badge);
                    tr.appendChild(tdStatus);

                    // Причина
                    const tdReason = document.createElement('td');
                    tdReason.className = 'reason-cell' + (v.reason ? '' : ' empty');
                    tdReason.textContent = v.reason || '—';
                    tr.appendChild(tdReason);

                    // Время
                    const tdTime = document.createElement('td');
                    tdTime.className = 'time-cell';
                    tdTime.textContent = formatTime(v.processed_at);
                    tr.appendChild(tdTime);

                    frag.appendChild(tr);
                }
                els.tableBody.appendChild(frag);
            }

            /* ---------- Обработчики ---------- */
            els.filterGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                els.filterGroup.querySelectorAll('.filter-btn')
                    .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStatus = btn.dataset.status;
                renderTable();
            });

            els.searchInput.addEventListener('input', (e) => {
                currentQuery = e.target.value;
                renderTable();
            });

            /* ---------- Загрузка JSON ---------- */
            async function loadData() {
                try {
                    const resp = await fetch(DATA_FILE, {cache: 'no-store'});
                    if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
                    const data = await resp.json();

                    if (!data || !Array.isArray(data.vacancies)) {
                        throw new Error('Некорректный формат JSON: отсутствует массив "vacancies"');
                    }

                    allVacancies = data.vacancies
                        .slice()
                        .sort((a, b) => {
                            const ta = a.processed_at ? new Date(a.processed_at).getTime() : 0;
                            const tb = b.processed_at ? new Date(b.processed_at).getTime() : 0;
                            return tb - ta; // по убыванию: новые сверху
                        });

                    renderHeader(data);
                    renderSummary(data.summary);

                    els.loader.style.display = 'none';
                    renderTable();
                } catch (err) {
                    els.loader.style.display = 'none';
                    els.errorBox.style.display = 'block';
                    els.errorBox.innerHTML =
                        `<strong>Не удалось загрузить данные из «${escapeHtml(DATA_FILE)}».</strong><br>` +
                        `Причина: ${escapeHtml(err.message)}<br><br>` +
                        `Убедитесь, что файл <code>${escapeHtml(DATA_FILE)}</code> лежит рядом с этим HTML-файлом ` +
                        `и что страница открыта через локальный веб-сервер (например, <code>python -m http.server</code>), ` +
                        `а не по протоколу <code>file://</code> — иначе браузер заблокирует fetch-запрос.`;
                    console.error(err);
                }
            }

            loadData();
        </script>
    </body>
</html>
