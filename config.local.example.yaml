# Шаблон личного конфига: скопируйте в config.local.yaml и заполните своими данными.
# config.local.yaml лежит в .gitignore — в репозиторий он не попадает.
# Значения отсюда переопределяют одноимённые ключи config.yaml.
# Раскладка та же, что в config.yaml: search → pipeline → prefilter → llm →
# notifications.

search:
  # Канал: hh (поиск по запросам) или habr (лента «Подходящие»).
  # Для habr запросы ниже не нужны.
  # channel: habr

  # Поисковые запросы: строка или список строк, поиск идёт по каждому отдельно.
  queries:
    - "Java developer"
    - "Java backend developer"

  # Стоп-слова в названии вакансии (без учёта регистра).
  exclude_keywords:
    - lead

  # Компании, на вакансии которых не откликаемся (подстрока, без учёта регистра).
  exclude_companies: []

pipeline:
  resume:
    # Название резюме: по нему выбирается резюме в отклике hh.ru и поднимается
    # резюме в поиске. Для канала hh значение обязательно.
    name: "Java Developer"

prefilter:
  # Ответы на вопросы анкеты работодателя: по ним строится ответ в форме отклика.
  # Пустое значение — «не заполнено»: такой вопрос уходит в ручные и никогда
  # не приводит к отсеву вакансии.
  answers:
    # Технологии, которыми владеете: по ним отвечаем «Да» на вопросы про стек.
    # Технология, которой нет в списке, вопрос не закрывает — он уйдёт в ручные.
    skills:
      - java
      - spring
      - spring boot
      - kafka
      - postgresql
      - hibernate
      - junit
    # Свободный текст для вопроса «важные достижения»: в форму уходит одной строкой.
    # achievements: "Перевёл монолит на микросервисы, сборка ускорилась в два раза."
    # Уровень образования: higher_tech | higher_other | none.
    education_level: higher_tech
    # Страна проживания: RU — «нахожусь в России».
    location_country: RU
    # Лет опыта: сравнивается с требованием из вопроса («опыт от 3 лет»).
    work_experience: 7
    # Минимальная зарплата: вписывается, когда вакансия просит сумму или число.
    salary_min: 250000
    # Свободный текст про зарплату: нужен, когда спрашивают «пожелания»,
    # а не конкретную сумму. В форму уходит одной строкой.
    salary_message: |
      По заработной плате ориентируюсь на рынок для уровня Middle,
      но готов обсудить конкретную вилку в зависимости от задач и команды.
    # Готовность к переезду: yes | no | remote_only.
    relocation_ready: "no"
    # Формат работы: office | hybrid | remote | any — одно значение или список.
    # В списке порядок = приоритет: берётся первый формат, который есть в анкете.
    work_format:
      - hybrid
      - remote
    # Право на работу: citizen | permit | sponsorship_needed.
    work_permit: citizen
    # Срок выхода с текущего места работы, дней.
    notice_period: 30
    # Языки и уровень: «ru: native, en: b2».
    languages: "ru: native, en: b2"
    # Электронная трудовая книжка.
    has_electronic_workbook: true
    # Готовность к командировкам.
    travel_ready: false

llm:
  cover_letter:
    # Ссылки на проекты: используются, если вакансия просит приложить их в письме.
    pet-projects:
      - https://github.com/username/project

    # Подпись с контактами: дописывается в конец письма через пустую строку.
    # Желательно одна-две строки: подпись считается в max_length.
    signature: |
      С уважением,
      Имя Фамилия
      Телеграм: @username
      Почта: username@example.com

notifications:
  email:
    # Адреса писем: отправитель и общий получатель отчёта и уведомлений о капче.
    sender: "noreply@domain.com"
    recipient: "username@domain.com"
